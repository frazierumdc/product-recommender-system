name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest
      - name: Demo run on synthetic data
        run: python -m recommender.pipeline --synthetic --out results/demo_metrics.json
      - name: Notebook runs top to bottom (synthetic data)
        run: python scripts/run_notebook.py notebooks/product_recommender.ipynb --env RECOMMENDER_SYNTHETIC=1 --no-save
