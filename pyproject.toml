[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "recommender"
version = "1.0.0"
description = "Product recommendations: popularity, user-user and item-item KNN, and SVD, compared on the same ratings."
readme = "README.md"
license = "MIT"
authors = [{ name = "Sean Frazier" }]
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["E402"]
